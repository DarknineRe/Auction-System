<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auction | BidHub</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/pages/bidding-detail.css}">
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="detail">
    <a class="detail__back" th:href="@{/}">&larr; All auctions</a>

    <div class="state" id="state" role="status"></div>

    <div class="detail__layout" id="layout" hidden>
      <section class="gallery" aria-label="Item photos">
        <div class="gallery__main" id="gallery-main"></div>
        <div class="gallery__thumbs" id="gallery-thumbs"></div>
      </section>

      <section class="info" aria-label="Auction details">
        <span class="badge" id="status-badge"></span>
        <h1 id="title"></h1>

        <p class="info__label" id="price-label"></p>
        <p class="info__price" id="price"></p>
        <p class="info__countdown" id="countdown" role="timer"></p>

        <form class="bid" id="bid-form" novalidate hidden>
          <div class="field">
            <label for="bid-amount">Your bid (THB)</label>
            <input type="number" id="bid-amount" inputmode="decimal" min="0" step="any" required>
            <p class="field__hint" id="bid-hint"></p>
          </div>
          <button type="submit" class="btn btn--primary" id="bid-btn">Place bid</button>
        </form>
        <p class="bid__note" id="bid-note" hidden></p>
        <p class="alert bid__msg" id="bid-msg" role="alert" hidden></p>

        <dl class="info__facts">
          <div class="info__row"><dt>Starting price</dt><dd id="starting-price"></dd></div>
          <div class="info__row"><dt>Started</dt><dd id="start-date"></dd></div>
          <div class="info__row"><dt>Ends</dt><dd id="end-date"></dd></div>
          <div class="info__row"><dt>Seller</dt><dd id="seller"></dd></div>
        </dl>

        <ul class="info__items" id="items" hidden></ul>
      </section>
    </div>

    <section class="history" id="history" aria-labelledby="history-title" hidden>
      <h2 id="history-title">Bid history <span class="history__count" id="history-count"></span></h2>
      <p class="history__empty" id="history-empty" hidden></p>
      <ol class="history__list" id="history-list"></ol>
    </section>

    <section class="comments" id="comments" aria-labelledby="comments-title" hidden>
      <h2 id="comments-title">Comments <span class="comments__count" id="comments-count"></span></h2>

      <form class="comments__form" id="comment-form" novalidate>
        <div class="field">
          <textarea id="comment-text" rows="3" maxlength="2000" required
                    aria-label="Write a comment"
                    placeholder="Ask the seller a question or share your thoughts..."></textarea>
        </div>
        <button type="submit" class="btn btn--primary" id="comment-btn">Post comment</button>
      </form>
      <p class="alert comments__msg" id="comment-msg" role="alert" hidden></p>

      <p class="comments__empty" id="comments-empty" hidden></p>
      <ul class="comments__list" id="comments-list"></ul>
    </section>
  </main>

  <script>
    // GET /api/v1/biddings/{id} -> BiddingResponse; item details from GET /api/v1/artworks/{id}
    const biddingId = location.pathname.split('/').filter(Boolean).pop();
    const baht = new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', maximumFractionDigits: 0 });
    const fmtDate = d => new Date(d).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
    const $ = id => document.getElementById(id);

    const STATUS = {
      ACTIVE:    { label: 'Active',    cls: 'badge--success' },
      CLOSED:    { label: 'Closed',    cls: 'badge--neutral' },
      CANCELLED: { label: 'Cancelled', cls: 'badge--danger' }
    };

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;   // textContent keeps user data safe from XSS
      return node;
    }

    function showState(type, title, text) {
      const state = $('state');
      state.className = 'state' + (type === 'error' ? ' state--error' : '');
      state.replaceChildren();
      if (type === 'loading') state.appendChild(el('div', 'spinner'));
      state.appendChild(el('p', 'state__title', title));
      if (text) state.appendChild(el('p', 'state__text', text));
      state.hidden = false;
    }

    async function loadArtwork(id) {
      try {
        const res = await fetch('/api/v1/artworks/' + id);
        return res.ok ? await res.json() : null;
      } catch (e) {
        return null;
      }
    }

    function renderGallery(artworks) {
      const main = $('gallery-main');
      const thumbs = $('gallery-thumbs');

      function select(index) {
        main.replaceChildren();
        const art = artworks[index];
        if (art && art.imageUrl) {
          const img = document.createElement('img');
          img.src = art.imageUrl;
          img.alt = art.title || 'Auction item';
          main.appendChild(img);
        }
        [...thumbs.children].forEach((t, i) => t.setAttribute('aria-current', String(i === index)));
      }

      if (artworks.length > 1) {
        artworks.forEach((art, i) => {
          const btn = el('button', 'gallery__thumb');
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Show ' + (art ? art.title : 'item ' + (i + 1)));
          if (art && art.imageUrl) {
            const img = document.createElement('img');
            img.src = art.imageUrl;
            img.alt = '';
            btn.appendChild(img);
          }
          btn.addEventListener('click', () => select(i));
          thumbs.appendChild(btn);
        });
      }
      select(0);
    }

    function render(b, artworks) {
      const status = STATUS[b.status] || { label: b.status, cls: 'badge--neutral' };
      $('status-badge').textContent = status.label;
      $('status-badge').className = 'badge ' + status.cls;

      const first = artworks[0];
      const title = first ? first.title : 'Auction #' + b.id;
      $('title').textContent = artworks.length > 1 ? title + ' + ' + (artworks.length - 1) + ' more' : title;
      document.title = title + ' | BidHub';

      updatePrice(b);
      $('starting-price').textContent = baht.format(b.startingPrice);
      $('start-date').textContent = fmtDate(b.startDate);
      $('end-date').textContent = fmtDate(b.endDate);
      $('seller').textContent = 'Seller #' + b.ownerId;

      if (artworks.length > 1) {
        const list = $('items');
        artworks.forEach((a, i) => list.appendChild(el('li', '', a ? a.title : 'Item ' + (i + 1))));
        list.hidden = false;
      }

      renderGallery(artworks);
    }

    let current = null;   // latest BiddingResponse
    let me = null;        // GET /api/v1/users/me (needed: PlaceBidRequest requires userId)

    async function getJson(url) {
      try {
        const res = await fetch(url);
        return res.ok ? await res.json() : null;
      } catch (e) {
        return null;
      }
    }

    function updatePrice(b) {
      const hasBid = b.lastBid != null;
      $('price-label').textContent = hasBid ? 'Current bid' : 'Starting price';
      $('price').textContent = baht.format(hasBid ? b.lastBid : b.startingPrice);
    }

    function showNote(text) {
      $('bid-form').hidden = true;
      $('bid-note').textContent = text;
      $('bid-note').hidden = false;
    }

    function showBidMessage(text, type) {
      const msg = $('bid-msg');
      msg.textContent = text;
      msg.className = 'alert alert--' + type + ' bid__msg';
      msg.hidden = false;
    }

    // Decide whether the bid form is shown, using the same rules the backend enforces
    async function setupBidding() {
      const b = current;
      $('bid-form').hidden = true;
      $('bid-note').hidden = true;

      if (b.status !== 'ACTIVE' || new Date() > new Date(b.endDate)) {
        showNote('This auction is not accepting bids.');
        return;
      }
      if (new Date() < new Date(b.startDate)) {
        showNote('This auction has not started yet.');
        return;
      }
      if (!me) {
        showNote('Could not load your account. Refresh the page to try again.');
        return;
      }
      if (me.id === b.ownerId) {
        showNote('This is your auction, so you cannot bid on it.');
        return;
      }

      // 404 here simply means "no bids yet"
      const highest = await getJson('/api/v1/biddings/' + b.id + '/bids/highest');
      if (highest && highest.userId === me.id) {
        showNote('You are currently the highest bidder.');
        return;
      }

      $('bid-hint').textContent = highest
        ? 'Your bid must be higher than the current bid.'
        : 'The first bid must be at least the starting price (' + baht.format(b.startingPrice) + ').';
      $('bid-form').hidden = false;
    }

    $('bid-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('bid-msg').hidden = true;

      const input = $('bid-amount');
      const amount = parseFloat(input.value);
      if (!Number.isFinite(amount) || amount <= 0) {
        showBidMessage('Enter a valid amount.', 'error');
        return;
      }

      const btn = $('bid-btn');
      btn.disabled = true;
      btn.textContent = 'Placing bid...';

      try {
        const res = await fetch('/api/v1/biddings/' + current.id + '/bids', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: me.id, amount: amount })
        });

        if (res.status === 401) { window.location.href = '/login'; return; }

        if (res.status === 201) {
          showBidMessage('Bid placed: ' + baht.format(amount), 'success');
          input.value = '';
          const fresh = await getJson('/api/v1/biddings/' + current.id);
          if (fresh) { current = fresh; updatePrice(fresh); }
          await setupBidding();
          loadHistory();
          return;
        }

        // Backend error format: { message, details: [...] }, e.g. 409 "Bid must be at least ..."
        const data = await res.json().catch(() => ({}));
        const detail = data.details && data.details.length ? ' ' + data.details.join(', ') : '';
        showBidMessage((data.message || 'Could not place your bid.') + detail, 'error');
      } catch (err) {
        showBidMessage('Cannot reach the server. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Place bid';
      }
    });

    // GET /api/v1/biddings/{id}/bids -> [BidActionResponse { id, userId, amount, timestamp }]
    async function loadHistory() {
      const list = $('history-list');
      const empty = $('history-empty');
      const bids = await getJson('/api/v1/biddings/' + current.id + '/bids');

      list.replaceChildren();
      empty.hidden = true;

      if (bids === null) {
        empty.textContent = 'Could not load the bid history.';
        empty.hidden = false;
        $('history-count').textContent = '';
        return;
      }
      if (bids.length === 0) {
        empty.textContent = 'No bids yet. Be the first to bid!';
        empty.hidden = false;
        $('history-count').textContent = '';
        return;
      }

      $('history-count').textContent = '(' + bids.length + ')';
      const highestAmount = Math.max(...bids.map(b => b.amount));
      const newestFirst = [...bids].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      newestFirst.forEach(bid => {
        const row = el('li', 'history__row');
        const who = el('div', 'history__who');
        const isMe = me && bid.userId === me.id;
        who.appendChild(el('span', 'history__name', isMe ? 'You' : 'User #' + bid.userId));
        who.appendChild(el('span', 'history__time', fmtDate(bid.timestamp)));

        const amount = el('div', 'history__amount');
        if (bid.amount === highestAmount) amount.appendChild(el('span', 'badge badge--success', 'Highest'));
        amount.appendChild(el('span', 'history__price', baht.format(bid.amount)));

        row.append(who, amount);
        list.appendChild(row);
      });
    }

    // ---- Comments: /api/v1/biddings/{id}/comments ----
    function showCommentMessage(text, type) {
      const msg = $('comment-msg');
      msg.textContent = text;
      msg.className = 'alert alert--' + type + ' comments__msg';
      msg.hidden = false;
    }

    // Shared by post / like / dislike / delete. Returns the Response, or null if it already handled the problem.
    async function commentRequest(path, options) {
      $('comment-msg').hidden = true;
      try {
        const res = await fetch('/api/v1/biddings/' + current.id + '/comments' + path, options);
        if (res.status === 401) { window.location.href = '/login'; return null; }
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          const detail = data.details && data.details.length ? ' ' + data.details.join(', ') : '';
          showCommentMessage((data.message || 'Something went wrong.') + detail, 'error');
          return null;
        }
        return res;
      } catch (e) {
        showCommentMessage('Cannot reach the server. Please try again.', 'error');
        return null;
      }
    }

    function buildComment(c) {
      const isMe = me && c.userId === me.id;
      const li = el('li', 'comment');

      const head = el('div', 'comment__head');
      head.appendChild(el('span', 'comment__author', isMe ? 'You' : 'User #' + c.userId));
      if (c.userId === current.ownerId) head.appendChild(el('span', 'badge badge--info', 'Seller'));
      li.appendChild(head);

      li.appendChild(el('p', 'comment__text', c.message));

      const actions = el('div', 'comment__actions');
      const up = el('button', 'comment__btn', '\uD83D\uDC4D ' + c.thumbsup);
      const down = el('button', 'comment__btn', '\uD83D\uDC4E ' + c.thumbsdown);
      up.type = down.type = 'button';
      up.setAttribute('aria-label', 'Like, ' + c.thumbsup + ' likes');
      down.setAttribute('aria-label', 'Dislike, ' + c.thumbsdown + ' dislikes');

      async function react(kind) {
        const res = await commentRequest('/' + c.id + '/' + kind, { method: 'POST' });
        if (!res) return;
        const fresh = await res.json();
        up.textContent = '\uD83D\uDC4D ' + fresh.thumbsup;
        down.textContent = '\uD83D\uDC4E ' + fresh.thumbsdown;
        up.setAttribute('aria-label', 'Like, ' + fresh.thumbsup + ' likes');
        down.setAttribute('aria-label', 'Dislike, ' + fresh.thumbsdown + ' dislikes');
      }
      up.addEventListener('click', () => react('like'));
      down.addEventListener('click', () => react('dislike'));
      actions.append(up, down);

      if (isMe) {
        const del = el('button', 'comment__btn comment__btn--danger', 'Delete');
        del.type = 'button';
        del.addEventListener('click', async () => {
          if (!confirm('Delete this comment?')) return;
          const res = await commentRequest('/' + c.id, { method: 'DELETE' });
          if (res) loadComments();
        });
        actions.appendChild(del);
      }

      li.appendChild(actions);
      return li;
    }

    async function loadComments() {
      const list = $('comments-list');
      const empty = $('comments-empty');
      const comments = await getJson('/api/v1/biddings/' + current.id + '/comments');

      list.replaceChildren();
      empty.hidden = true;
      $('comments-count').textContent = '';

      if (comments === null) {
        empty.textContent = 'Could not load comments.';
        empty.hidden = false;
        return;
      }
      if (comments.length === 0) {
        empty.textContent = 'No comments yet. Start the conversation!';
        empty.hidden = false;
        return;
      }

      $('comments-count').textContent = '(' + comments.length + ')';
      [...comments].sort((a, b) => b.id - a.id).forEach(c => list.appendChild(buildComment(c)));
    }

    $('comment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = $('comment-text');
      const message = input.value.trim();
      if (!message) { showCommentMessage('Write something before posting.', 'error'); return; }

      const btn = $('comment-btn');
      btn.disabled = true;
      btn.textContent = 'Posting...';

      const res = await commentRequest('', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
      });
      if (res) { input.value = ''; await loadComments(); }

      btn.disabled = false;
      btn.textContent = 'Post comment';
    });

    // ---- Countdown: ticks every second from current.startDate / current.endDate ----
    let countdownTimer = null;
    let endHandled = false;

    function formatRemaining(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const days = Math.floor(total / 86400);
      const pad = n => String(n).padStart(2, '0');
      return (days > 0 ? days + 'd ' : '')
        + pad(Math.floor((total % 86400) / 3600)) + 'h '
        + pad(Math.floor((total % 3600) / 60)) + 'm '
        + pad(total % 60) + 's';
    }

    function startCountdown() {
      clearInterval(countdownTimer);
      endHandled = false;
      const box = $('countdown');

      function set(text, cls) {
        box.textContent = text;
        box.className = 'info__countdown' + (cls ? ' ' + cls : '');
      }

      function tick() {
        const b = current;
        if (b.status === 'CANCELLED') { set('Auction cancelled', 'is-over'); clearInterval(countdownTimer); return; }
        if (b.status === 'CLOSED')    { set('Auction closed', 'is-over');    clearInterval(countdownTimer); return; }

        const now = Date.now();
        const start = new Date(b.startDate).getTime();
        const end = new Date(b.endDate).getTime();

        if (now < start) { set('Starts in ' + formatRemaining(start - now)); return; }

        if (now >= end) {
          set('Auction ended', 'is-over');
          clearInterval(countdownTimer);
          if (!endHandled) {
            endHandled = true;
            // The backend closes the auction on a schedule, so the status may still say ACTIVE for a moment
            $('status-badge').textContent = 'Ended';
            $('status-badge').className = 'badge badge--neutral';
            setupBidding();   // hides the bid form
          }
          return;
        }

        set('Ends in ' + formatRemaining(end - now), end - now < 3600000 ? 'is-urgent' : '');
      }

      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    async function load() {
      showState('loading', 'Loading auction...');
      try {
        const res = await fetch('/api/v1/biddings/' + encodeURIComponent(biddingId));
        if (res.status === 401) { window.location.href = '/login'; return; }
        if (res.status === 404) { showState('empty', 'Auction not found', 'It may have been removed.'); return; }
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const bidding = await res.json();
        const [artworks, user] = await Promise.all([
          Promise.all(bidding.artworkIds.map(loadArtwork)),
          getJson('/api/v1/users/me')
        ]);
        current = bidding;
        me = user;
        render(bidding, artworks);
        $('state').hidden = true;
        $('layout').hidden = false;
        $('history').hidden = false;
        setupBidding();
        startCountdown();
        loadHistory();
        $('comments').hidden = false;
        loadComments();
      } catch (e) {
        showState('error', 'Could not load this auction', 'Please refresh the page and try again.');
      }
    }

    load();
  </script>
</body>
</html>
