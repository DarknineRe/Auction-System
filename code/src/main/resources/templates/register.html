<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | BidHub</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/pages/register.css}">
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="register">
    <div class="register__card">
      <h1>Create your account</h1>
      <p class="register__sub">Join BidHub and start bidding today.</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="register__row">
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" required>
            <p class="field__hint">8-72 characters</p>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
          </div>
        </div>

        <div class="field">
          <label for="phone">Phone <span class="field__hint">(optional)</span></label>
          <input type="tel" id="phone" name="phone" autocomplete="tel">
        </div>

        <div class="field">
          <label for="address">Address <span class="field__hint">(optional)</span></label>
          <input type="text" id="address" name="address" autocomplete="street-address">
        </div>

        <button type="submit" class="btn btn--primary" id="submit-btn">Sign up</button>

        <p class="alert register__message" id="message" role="alert" hidden></p>

        <p class="register__footer">
          Already have an account? <a th:href="@{/login}">Log in</a>
        </p>
      </form>
    </div>
  </main>

  <script>
    // Posts JSON to POST /api/v1/users (public endpoint, CSRF-exempt)
    const form = document.getElementById('register-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('message');

    function show(text, type) {
      msg.textContent = text;
      msg.className = 'alert alert--' + type + ' register__message';
      msg.hidden = false;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.hidden = true;

      if (!form.checkValidity()) { form.reportValidity(); return; }
      if (form.password.value !== form.confirm.value) {
        show('Passwords do not match.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await fetch('/api/v1/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: form.name.value.trim(),
            email: form.email.value.trim(),
            password: form.password.value,
            phone: form.phone.value.trim() || null,
            address: form.address.value.trim() || null
          })
        });

        if (res.status === 201) {
          show('Account created! Redirecting to log in...', 'success');
          setTimeout(() => { window.location.href = '/login'; }, 1200);
          return;
        }

        // Backend error format: { message, details: [...] }
        const data = await res.json().catch(() => ({}));
        const detail = data.details && data.details.length ? ' ' + data.details.join(', ') : '';
        show((data.message || 'Something went wrong.') + detail, 'error');
      } catch (err) {
        show('Cannot reach the server. Please try again.', 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Sign up';
    });
  </script>
</body>
</html>
