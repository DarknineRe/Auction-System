<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auctions | BidHub</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/pages/home.css}">
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="home">
    <header class="home__header">
      <h1>Live auctions</h1>
      <p>Browse items open for bidding and place your bid.</p>
    </header>

    <div th:if="${param.bidPlaced}" class="alert alert--success" role="status">Your bid was placed.</div>
    <div th:if="${biddings.content.isEmpty()}" class="state">
      <p class="state__title">No active auctions right now</p>
      <p class="state__text">Check back soon for new items.</p>
    </div>

    <div class="card-grid" th:unless="${biddings.content.isEmpty()}">
      <a class="card" th:each="bidding : ${biddings.content}"
         th:href="@{/biddings/{id}(id=${bidding.id})}">
        <div class="card__media">
          <img th:if="${!bidding.artworks.isEmpty() and bidding.artworks[0].imageUrl != null}"
               th:src="${bidding.artworks[0].imageUrl}"
               th:alt="${bidding.artworks[0].title}" loading="lazy">
        </div>
        <div class="card__body">
          <span class="badge badge--success">Active</span>
          <h2 class="card__title"
              th:text="${bidding.artworks.isEmpty() ? 'Auction #' + bidding.id : bidding.artworks[0].title}">
            Auction item
          </h2>
          <p class="card__label" th:text="${bidding.lastBid == null ? 'Starting price' : 'Current bid'}">Starting price</p>
          <p class="card__price"
             th:text="${#numbers.formatDecimal(bidding.lastBid == null ? bidding.startingPrice : bidding.lastBid, 1, 'COMMA', 2, 'POINT')} + ' THB'">
            0 THB
          </p>
          <p class="card__meta">
            <span th:text="'Ends ' + ${#dates.format(bidding.endDate, 'dd MMM yyyy HH:mm')}">End date</span>
            <span th:if="${bidding.artworks.size() > 1}"
                  th:text="' · ' + ${bidding.artworks.size()} + ' items'"></span>
          </p>
        </div>
      </a>
    </div>

    <nav class="pagination" aria-label="Auction pages" th:if="${biddings.totalPages > 1}">
      <a class="pagination__btn"
         th:classappend="${biddings.first ? ' pagination__btn--disabled' : ''}"
         th:if="${!biddings.first}" th:href="@{/(page=${biddings.number - 1})}">Previous</a>
      <span class="pagination__btn pagination__btn--disabled" th:if="${biddings.first}">Previous</span>
      <span class="pagination__info"
            th:text="'Page ' + ${biddings.number + 1} + ' of ' + ${biddings.totalPages}">Page</span>
      <a class="pagination__btn" th:if="${!biddings.last}"
         th:href="@{/(page=${biddings.number + 1})}">Next</a>
      <span class="pagination__btn pagination__btn--disabled" th:if="${biddings.last}">Next</span>
    </nav>
  </main>
</body>
</html>
