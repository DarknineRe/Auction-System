services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auction_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./code
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      TZ: Asia/Bangkok
      DB_URL: jdbc:postgresql://database:5432/auction
      DB_USERNAME: auction
      DB_PASSWORD: ${DB_PASSWORD:-auction_local_only}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-local-compose-only-change-before-production}

volumes:
  postgres_data: